name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same images and ports as docker-compose.yml, so tests run against the same services as locally.
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: vento_hotels
          POSTGRES_PASSWORD: vento_hotels
          POSTGRES_DB: vento_hotels_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vento_hotels -d vento_hotels_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      storage:
        image: rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: vento-hotels-local
          RUSTFS_SECRET_KEY: vento-hotels-local-secret
        ports:
          - 9100:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://vento_hotels:vento_hotels@localhost:5433/vento_hotels_test
      TEST_DATABASE_URL: postgres://vento_hotels:vento_hotels@localhost:5433/vento_hotels_test
      S3_ENDPOINT: http://localhost:9100
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (lint and format)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Services reachable
        run: pnpm db:status

      - name: Migrations match the schema
        # Fails if a schema file changed without a generated migration being committed.
        run: |
          pnpm --filter @vento/api exec drizzle-kit check
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle || (echo "::error::Schema changed without a migration. Run pnpm db:generate and commit apps/api/drizzle." && exit 1)
          test -z "$(git status --porcelain -- apps/api/drizzle)" || (echo "::error::Untracked migration files. Run pnpm db:generate and commit apps/api/drizzle." && exit 1)

      - name: Migrations apply cleanly
        run: pnpm --filter @vento/api db:migrate

      - name: Test
        run: pnpm test

      - name: Build the web app and check speed budgets
        run: |
          pnpm --filter @vento/web build
          pnpm --filter @vento/web size

      - name: Install browser for end-to-end tests
        run: pnpm --filter @vento/web exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (desktop and phone, light and dark)
        run: pnpm e2e

      - name: Keep the browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
