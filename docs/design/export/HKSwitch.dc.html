<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Housekeeping phone switch person</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vento.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{theme}} touch" style="width: 390px; height: 844px; overflow: hidden; position: relative; font-family: Inter, system-ui, sans-serif">
<div style="padding: 16px"><span class="t-h2">My rooms</span><div class="col" style="gap: 10px; margin-top: 12px"><div class="card" style="height: 64px"></div><div class="card" style="height: 64px"></div><div class="card" style="height: 64px"></div><div class="card" style="height: 64px"></div></div></div>
<div class="scrim"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 18px 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-lg)">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--border-strong)"></span>
<span class="t-h2">Switch person</span>
<div class="inset t-sm" style="padding: 10px 12px; background: var(--am-bg); border-color: transparent; color: var(--am)">Grace has 2 updates waiting to sync. They stay under her name.</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px"><button class="col" style="align-items: center; gap: 6px; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">CO</span><span class="t-sm">Chioma</span></button><button class="col" style="align-items: center; gap: 6px; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">HY</span><span class="t-sm">Halima</span></button><button class="col" style="align-items: center; gap: 6px; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">PE</span><span class="t-sm">Peter</span></button><button class="col" style="align-items: center; gap: 6px; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">BO</span><span class="t-sm">Blessing</span></button></div>
<button class="btn xl">Sign out Grace</button>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'vt dark' : 'vt' };
  }
}
</script>
</body>
</html>
