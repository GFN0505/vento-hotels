<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Housekeeping phone lock</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vento.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{theme}} touch" style="box-sizing: border-box; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; padding: 24px 20px; gap: 18px">
  <div class="row between"><div class="col"><span class="t-h2">Housekeeping</span><span class="t-sm muted">Kora VI · HK-VI-07</span></div><span class="num" style="font-size: 22px; font-weight: 600">13:58</span></div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px">
    <button class="col" style="align-items: center; gap: 6px; padding: 8px 0; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px; box-shadow: 0 0 0 3px var(--brand)">GA</span><span class="t-sm medium">Grace</span></button>
    <button class="col" style="align-items: center; gap: 6px; padding: 8px 0; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">CO</span><span class="t-sm">Chioma</span></button>
    <button class="col" style="align-items: center; gap: 6px; padding: 8px 0; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">HY</span><span class="t-sm">Halima</span></button>
    <button class="col" style="align-items: center; gap: 6px; padding: 8px 0; border: 0; background: transparent; font: inherit; color: inherit"><span class="av" style="width: 52px; height: 52px; font-size: 16px">PE</span><span class="t-sm">Peter</span></button>
  </div>
  <div class="col" style="align-items: center; gap: 16px; margin-top: 8px">
    <span class="medium">Grace, enter your PIN</span>
    <div class="pdots"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="pin" style="grid-template-columns: repeat(3, 84px); gap: 12px"><button style="height: 64px">1</button><button style="height: 64px">2</button><button style="height: 64px">3</button><button style="height: 64px">4</button><button style="height: 64px">5</button><button style="height: 64px">6</button><button style="height: 64px">7</button><button style="height: 64px">8</button><button style="height: 64px">9</button><button style="height: 64px; font-size: 13px; color: var(--text-2)">Back</button><button style="height: 64px">0</button><button style="height: 64px" aria-label="Delete"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button></div>
  </div>
  <span class="t-sm faint" style="text-align: center; margin-top: auto">Works without signal. Signs out after 5 minutes idle. Switch person any time from the menu.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'vt dark' : 'vt' };
  }
}
</script>
</body>
</html>
