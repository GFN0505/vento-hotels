<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager approves on phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vento.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{theme}} touch" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif">
<header style="padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border)"><div class="row between"><span class="t-h2">Approvals</span><span class="badge b-vi nd num">3</span></div></header>
<div class="col" style="padding: 14px; gap: 12px">
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-color: var(--pri-line)">
<div class="row between"><span class="lbl">Calabash · POS-VI-03</span><span class="badge b-am">Waiting · 1 min</span></div>
<div class="row between"><span class="t-h2">Discount 25%</span><span class="t-h2 num">₦14,500.00</span></div>
<span class="t-sm muted num">Check 1184 · ₦58,000.00 → ₦43,500.00 · Musa Ibrahim's limit is 10%</span>
<span>“Service delay · mains took 40 minutes”</span>
<div class="col" style="align-items: center; gap: 12px; padding-top: 6px"><span class="t-sm medium">Tola, enter your PIN to approve</span><div class="pdots"><i class="on"></i><i class="on"></i><i></i><i></i></div>
<div class="pin" style="grid-template-columns: repeat(3, 72px); gap: 10px"><button style="height: 56px">1</button><button style="height: 56px">2</button><button style="height: 56px">3</button><button style="height: 56px">4</button><button style="height: 56px">5</button><button style="height: 56px">6</button><button style="height: 56px">7</button><button style="height: 56px">8</button><button style="height: 56px">9</button><button style="height: 56px; font-size: 13px; color: var(--text-2)">Decline</button><button style="height: 56px">0</button><button style="height: 56px" aria-label="Delete"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button></div></div>
</div>
<div class="card" style="padding: 12px 14px; display: flex; justify-content: space-between; align-items: center"><div class="col"><span class="medium">Void after audit · Folio B</span><span class="t-sm muted num">Chidi Eze · ₦26,950.00 · 6 min</span></div><span class="t-sm ink-pri">Open</span></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'vt dark' : 'vt' };
  }
}
</script>
</body>
</html>
