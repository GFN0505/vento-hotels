<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supervisor inspection</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vento.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{theme}} touch" style="width: 390px; height: 1000px; overflow: hidden; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; position: relative">
  <header style="padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="color: var(--text); display: flex"><svg class="ic ic-l" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="col grow"><span class="t-h2 num">Inspect 402</span><span class="t-sm muted">Cleaned by Grace Akpan · 13:40 · arrival 15:00</span></div>
    <span class="t-sm muted num">1 of 3</span>
  </header>
  <div class="col" style="padding: 14px 12px 150px; gap: 12px">
    <div class="card">
      <div class="row between" style="padding: 12px 14px; border-bottom: 1px solid var(--border)"><span>Bed and linen</span><div class="seg"><button class="on" style="height: 36px; padding: 0 14px; color: var(--em)">Pass</button><button style="height: 36px; padding: 0 14px">Fail</button></div></div>
      <div class="col" style="padding: 12px 14px; border-bottom: 1px solid var(--border); gap: 10px; background: var(--ro-bg)">
        <div class="row between"><span class="medium">Bathroom</span><div class="seg" style="background: var(--surface)"><button style="height: 36px; padding: 0 14px">Pass</button><button class="on" style="height: 36px; padding: 0 14px; color: var(--ro)">Fail</button></div></div>
        <div class="input" style="height: 44px">Hair on sink, refill shampoo</div>
        <div class="row" style="gap: 8px"><div class="ph" style="width: 64px; height: 64px; border-radius: 8px"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/></svg></div><button class="btn sm">Add photo</button></div>
      </div>
      <div class="row between" style="padding: 12px 14px; border-bottom: 1px solid var(--border)"><span>Floor and surfaces</span><div class="seg"><button class="on" style="height: 36px; padding: 0 14px; color: var(--em)">Pass</button><button style="height: 36px; padding: 0 14px">Fail</button></div></div>
      <div class="row between" style="padding: 12px 14px; border-bottom: 1px solid var(--border)"><span>Amenities</span><div class="seg"><button class="on" style="height: 36px; padding: 0 14px; color: var(--em)">Pass</button><button style="height: 36px; padding: 0 14px">Fail</button></div></div>
      <div class="row between" style="padding: 12px 14px; border-bottom: 1px solid var(--border)"><span>Minibar full</span><div class="seg"><button class="on" style="height: 36px; padding: 0 14px; color: var(--em)">Pass</button><button style="height: 36px; padding: 0 14px">Fail</button></div></div>
      <div class="row between" style="padding: 12px 14px"><span>AC, TV, lights</span><div class="seg"><button class="on" style="height: 36px; padding: 0 14px; color: var(--em)">Pass</button><button style="height: 36px; padding: 0 14px">Fail</button></div></div>
    </div>
    <div class="field"><label>Note for Grace</label><div class="input" style="height: 44px; color: var(--text-3)">Optional</div></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px">
    <button class="btn pri xl" style="width: 100%">Send back to Grace · 1 item</button>
    <span class="t-sm muted" style="text-align: center">She gets it at the top of her list. 402 stays Clean until it passes.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'vt dark' : 'vt' };
  }
}
</script>
</body>
</html>
